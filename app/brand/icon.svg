<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1150"/>
      <stop offset="0.55" stop-color="#3a23b0"/>
      <stop offset="1" stop-color="#7a3fe4"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="0.45" stop-color="#ffd24d"/>
      <stop offset="1" stop-color="#ffa41b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- orbit: the idea circling before it lands -->
  <g transform="rotate(-24 256 268)">
    <ellipse cx="256" cy="268" rx="196" ry="74" fill="none" stroke="#ffd24d" stroke-opacity="0.16" stroke-width="16"/>
    <ellipse cx="256" cy="268" rx="196" ry="74" fill="none" stroke="#ffe79a" stroke-opacity="0.5" stroke-width="5"/>
  </g>
  <!-- glow, built from layered shapes so no SVG filter is needed -->
  <circle cx="256" cy="248" r="138" fill="#ffd24d" fill-opacity="0.07"/>
  <circle cx="256" cy="248" r="104" fill="#ffd24d" fill-opacity="0.1"/>
  <!-- the spark: the aha itself -->
  <path d="M256 112 Q278 226 392 248 Q278 270 256 384 Q234 270 120 248 Q234 226 256 112 Z" fill="url(#spark)"/>
  <path d="M256 170 Q268 236 334 248 Q268 260 256 326 Q244 260 178 248 Q244 236 256 170 Z" fill="#fffdf2" fill-opacity="0.92"/>
  <!-- two small sparks, off-axis so the mark is not perfectly symmetric -->
  <path d="M392 352 Q399 379 426 386 Q399 393 392 420 Q385 393 358 386 Q385 379 392 352 Z" fill="#ffe79a" fill-opacity="0.95"/>
  <path d="M116 132 Q121 152 141 157 Q121 162 116 182 Q111 162 91 157 Q111 152 116 132 Z" fill="#ffe79a" fill-opacity="0.8"/>
</svg>
